# ── platform disables ───────────────────────────────────────────────────────
# Re-verified against the 0.2.0-rc.2 composition, not assumed: subprocess,
# bash-sandbox, permission, session-persistence-jsonl and fs-sandbox are all
# still official rows (`dsh --profile headless --dump-default-config`). The
# 0.1.5-rc.1 -> 0.2.0-rc.2 delta removes workflow-worker-thread, code-runtime,
# ui-schedule and agent-presets and adds 31 rows; none of those ids is
# referenced by this profile, and `ui-schedule`/`schedule` do not exist in
# 0.2.0-rc.2 at all (0.2.1-alpha.1 re-adds them).
#
# `workspace-changes` — the new 0.2 package that reads workspace bytes with
# host `node:fs` and has no `ctx.fs` seam — is a dsh-web-app row and is NOT
# part of the headless composition (the dump above has no such row). A disable
# row for an unknown id is not a silent no-op: cordis answers
# `patch: entry "workspace-changes" not found` on stderr while still exiting 0,
# and this profile must keep `--dump-config` stderr clean. So the headless
# profile records the decision instead of restating the web disable; if the row
# ever enters this composition, add the same disable here (and its rationale
# lives in docker/profiles/web.cordis.patch.yml).
- id: subprocess
  disabled: true
- id: bash-sandbox
  disabled: true
- id: permission
  disabled: true
- id: session-persistence-jsonl
  disabled: true
- id: fs-sandbox
  disabled: true
- insert:
    - id: workspace-runtime
      name: '@visecy/dsh-workspace-k8s'
      config:
        namespace: !!js process.env.WS_NAMESPACE
        image: !!js process.env.WS_IMAGE ?? 'ghcr.io/visecy/dsh-platform/dsh-sandbox-daemon:v0.1.19'
        daemonPort: 4390
        idleTimeoutMs: !!js Number(process.env.WS_IDLE_TIMEOUT_MS ?? (5 * 60 * 1000))
        graceMs: !!js Number(process.env.WS_GRACE_MS ?? (3 * 60 * 60 * 1000))
        reconcileIntervalMs: !!js Number(process.env.WS_RECONCILE_INTERVAL_MS ?? 60000)
        storageClassName: !!js process.env.WS_STORAGE_CLASS ?? 'local-path'
        storageSize: '2Gi'
    - id: storage-db
      name: '@visecy/dsh-storage-db'
      config:
        type: postgres
        connectionString: !!js process.env.DSH_PG_CONNECTION_STRING
    - id: platform-domain
      name: '@visecy/dsh-platform-domain'
      config:
        backend: postgres
    - id: fs-k8s
      name: '@visecy/dsh-fs-k8s'
      config:
        daemonEndpoint: !!js (process.env.WS_DAEMON_ENDPOINT ?? 'http://127.0.0.1:4390')
        hostRoot: '/workspaces'
        podRoot: '/workspaces'
    - id: subprocess-k8s
      name: '@visecy/dsh-subprocess-k8s'
      config:
        daemonEndpoint: !!js (process.env.WS_DAEMON_ENDPOINT ?? 'http://127.0.0.1:4390')
        podRoot: '/workspaces'
    - id: session-persistence-rdb
      name: '@visecy/dsh-session-persistence-rdb'
      config:
        type: postgres
        connectionString: !!js process.env.DSH_PG_CONNECTION_STRING
    - id: bash-local
      name: '@deepseek-ai/dsh-bash-local'
      config:
        cwd: '/workspaces'
# See docker/profiles/web.cordis.patch.yml for the full reasoning. The official
# `dsh-workspace` registry persists through the official `dsh-storage-domain`
# row (`backend: json` under DSH_HOME, an emptyDir); routing it to the postgres
# backend `storage-db` registers keeps the registry — and with it the only copy
# of the session<->workspace association — across pod replacements.
#
# TOP-LEVEL row by design (not an `insert:` entry): it patches the base row in
# place instead of adding a second `storage-domain` id to the loader.
#
# ORDERING CONSTRAINT: ships together with the workspace-k8s startup reconcile
# and session rebind; this row alone would freeze an empty association set.
- id: storage-domain
  config:
    backend: postgres
