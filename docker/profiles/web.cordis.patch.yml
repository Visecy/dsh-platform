- id: subprocess
  disabled: true
- id: bash-sandbox
  disabled: true
- id: permission
  disabled: true
- id: session-persistence-jsonl
  disabled: true
- id: fs-sandbox
  disabled: true
- id: directory-picker
  disabled: true
# The web app announces this process's launch-token URL on stdout
# (`dsh web: http://…/?token=<launchToken>`) and tries to hand the URL to a
# desktop browser. In a container that means (a) a process-wide authentication
# secret lands in the pod logs and (b) every boot logs a failed browser launch.
# Neither is wanted here: the oauth2-proxy sidecar is the deployment's entry
# point, and for a browser that reaches this process the identity-bridge row
# below performs the launch-token handoff itself (302 -> 303) without printing
# anything.
- id: web-runtime
  name: '@deepseek-ai/dsh-web-app'
  inject:
    - webStartup
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: true
    trustedHosts: !!js ctx.webStartup.trustedHosts
# The official ui-workspace row is ENABLED (default) again: it owns the sidebar
# workspace/session list, the conversation hero and the `sidebar.workspaces`
# contract. The platform no longer keeps a patched copy of that browser, so
# there is no second registrant of the `workspace` locale namespace and nothing
# to collide with. @visecy/dsh-workspace-k8s only ADDS a status panel on the
# official slots (main keyed panel + sidebar.panellist entry); see
# packages/workspace-k8s/src/client.
# DSH 0.1.5 row inventory notes (dsh-web-app):
#  - `file-upload` (host `fileUploads` + client `fileUpload`), `resources` and
#    `workspace-files` are LOAD-BEARING: 0.1.5's dsh-api-session-controller
#    requires the `fileUploads` inject, so disabling `file-upload` leaves
#    `session-controller` pending and fails the launcher activation assertion.
#    Do not add disables for them.
#  - `open-in-app` / `ui-open-in-app` are safe to disable in a remote
#    deployment (nothing injects their service); they are left enabled here so
#    the official produced-file affordances keep working through
#    subprocess-k8s.
#  - `tool-str-replace-editor` no longer exists in 0.1.5's base profile.
# DSH 0.1.2+ (unchanged in 0.1.5): dsh-client-connection runs one uniform
# Host/Origin fence over every /api request / RPC channel / WebSocket upgrade,
# gated on its official `trustedHosts` config. The CLI already forwards
# --trusted-host values into this row via ctx.webRuntime; restate the row so
# deployments can also list public authorities through DSH_TRUSTED_HOSTS
# (comma-separated, BARE host[:port] authorities only — assertTrustedAuthority
# rejects schemes, paths and whitespace at plugin load). The built-in
# browser-session cookie layer is NOT bypassed: identity-bridge satisfies it
# through the official `authenticatedUrl()` -> `authorizeIndex()` exchange, so
# no compiled-artifact patch and no webserver fork is involved.
- id: connection
  name: '@deepseek-ai/dsh-client-connection'
  inject:
    - webRuntime
  config:
    trustedHosts: !!js >-
      [...(process.env.DSH_TRUSTED_HOSTS ?? '').split(',').map(entry => entry.trim()).filter(Boolean),
      ...ctx.webRuntime.trustedHosts]
- insert:
    # identity-bridge owns the exact `/` route (official token handoff via
    # authenticatedUrl/authorizeIndex), publishes __DSH_TRANSPORT__ so a remote
    # browser behaves as a host, and provides ctx.dshAuth over the oauth2-proxy
    # headers. The sidecar is the only thing that may reach this process, so
    # those headers are trusted evidence. Do NOT add a host here: the deploy
    # chart passes the loopback bind to `dsh web`.
    - id: identity-bridge
      name: '@visecy/dsh-identity-bridge'
      config:
        publicOrigin: !!js process.env.DSH_PUBLIC_ORIGIN
    - id: workspace-runtime
      name: '@visecy/dsh-workspace-k8s'
      config:
        namespace: !!js process.env.WS_NAMESPACE
        image: !!js process.env.WS_IMAGE ?? 'ghcr.io/visecy/dsh-platform/dsh-sandbox-daemon:v0.1.19'
        daemonPort: 4390
        idleTimeoutMs: !!js Number(process.env.WS_IDLE_TIMEOUT_MS ?? (5 * 60 * 1000))
        graceMs: !!js Number(process.env.WS_GRACE_MS ?? (3 * 60 * 60 * 1000))
        reconcileIntervalMs: !!js Number(process.env.WS_RECONCILE_INTERVAL_MS ?? 60000)
        storageClassName: !!js process.env.WS_STORAGE_CLASS ?? 'local-path'
        storageSize: '2Gi'
        metricIntervalMs: !!js Number(process.env.WS_METRIC_INTERVAL_MS ?? 15000)
        resources:
          cpu: !!js process.env.WS_CPU_LIMIT ?? '2'
          memory: !!js process.env.WS_MEM_LIMIT ?? '2Gi'
    - id: storage-db
      name: '@visecy/dsh-storage-db'
      config:
        type: postgres
        connectionString: !!js process.env.DSH_PG_CONNECTION_STRING
    - id: platform-domain
      name: '@visecy/dsh-platform-domain'
      config:
        backend: postgres
    - id: fs-k8s
      name: '@visecy/dsh-fs-k8s'
      config:
        daemonEndpoint: !!js (process.env.WS_DAEMON_ENDPOINT ?? 'http://127.0.0.1:4390')
        hostRoot: '/workspaces'
        podRoot: '/workspaces'
    - id: subprocess-k8s
      name: '@visecy/dsh-subprocess-k8s'
      config:
        daemonEndpoint: !!js (process.env.WS_DAEMON_ENDPOINT ?? 'http://127.0.0.1:4390')
        podRoot: '/workspaces'
    - id: session-persistence-rdb
      name: '@visecy/dsh-session-persistence-rdb'
      config:
        type: postgres
        connectionString: !!js process.env.DSH_PG_CONNECTION_STRING
    - id: bash-local
      name: '@deepseek-ai/dsh-bash-local'
      config:
        cwd: '/workspaces'
    - id: workspace-picker
      name: '@visecy/dsh-workspace-picker'
      config:
        namespace: !!js process.env.WS_NAMESPACE
        daemonPort: 4390
        hostRoot: '/workspaces'
    # the disabled auto picker used to mount the browse UI surface via
    # ctx.loader.create; with our workspace-picker providing the capability,
    # mount the browse surface explicitly so the in-app workspace directory
    # browser renders again.
    - id: ui-directory-picker-browse
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
# The official `@deepseek-ai/dsh-workspace` persists its whole registry through
# `ctx.storageDomain` — workspace records INCLUDING each record's `sessionIds`,
# which is the only place the session<->workspace association exists. That
# service is the official `dsh-storage-domain` row, whose base config is
# `backend: json` rooted at `dshHomePath('storages')`: an emptyDir here, so the
# registry is wiped on every pod replacement and the sidebar drops every
# session to "Ungrouped".
#
# Restate the row with the backend `storage-db` already registers and provides
# (`type: postgres` — see storage-db/src/index.ts) so the official facility
# reaches Postgres. This MUST be a TOP-LEVEL row, not an `insert:` entry: the
# base profile already owns `storage-domain`, and inserting the same id makes
# the loader carry two rows for it (see the f830ddf/e06e809 history). A
# top-level row patches the base row in place and keeps its `name`.
#
# ORDERING CONSTRAINT: this row must ship together with the startup reconcile
# and the session rebind in packages/workspace-k8s. If the first boot on the DB
# backend still lacks the /workspaces/<id> anchors, the registry writes an empty
# association set to Postgres and `initialized: true` makes it permanent.
- id: storage-domain
  config:
    backend: postgres
