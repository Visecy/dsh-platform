# ── platform disables ───────────────────────────────────────────────────────
# Re-verified against the 0.2.0-rc.2 composition, not assumed: every id below
# (subprocess, bash-sandbox, permission, session-persistence-jsonl, fs-sandbox,
# directory-picker) is still an official row of the base + web-app bundle
# layers (`dsh --profile web --dump-default-config`), so no disable in this
# file went stale and none had to be dropped.
#
# The 0.1.5-rc.1 -> 0.2.0-rc.2 effective row delta is 4 rows REMOVED
# (workflow-worker-thread, code-runtime, ui-schedule, agent-presets) and 31
# ADDED (tool-plugin-manager, plugin-manager, config-editor, authorization,
# deepseek-account, otel, ptc-runtime, workflow-ptc, image-offload,
# mcp-resources, llm-deepseek-account, desktop-product-telemetry,
# product-analytics, job-controller, terminal-controller,
# ui-settings-account, account-controller, cordis-inspect-providers,
# shortcuts, ui-shortcuts, office-to-pdf, ui-sidebar-browser,
# ui-sidebar-terminal, ui-plugin-manager, workspace-changes,
# ui-settings-session-log, ui-settings-shell, ui-settings-agent-loop,
# ui-settings-subagent, ui-settings-web-search, agent-preset-registry), plus
# name changes (hmr, settings, llm-deepseek) and config-key changes
# (session-telemetry-otel +maxRequestBytes, spill-policy maxInlineBytes ->
# maxInlineTokens) on rows this file does not restate.
#
# `ui-schedule` is NOT a 0.2.0-rc.2 row at all (0.2.1-alpha.1 re-adds it,
# enabled), so there is nothing to enable or disable for it here. Likewise
# 0.2.0-rc.2's `web-runtime` has no `publicUrl` key — see the restatement
# below, which is complete for the version this tree pins.
- id: subprocess
  disabled: true
- id: bash-sandbox
  disabled: true
- id: permission
  disabled: true
- id: session-persistence-jsonl
  disabled: true
- id: fs-sandbox
  disabled: true
- id: directory-picker
  disabled: true
# The model API key (and every other stored credential) is CONTROL-PLANE STATE,
# not user content, and it must outlive the pod. The official row keeps its store
# in `$DSH_HOME/.credentials.yaml`, which the chart mounts as an emptyDir and the
# deployment restores from the image on every boot — so every pod replacement
# wiped it and the operator re-typed the key after every upgrade. Its
# replacement is `@visecy/dsh-platform-domain` (the `platform-domain` row in the
# insert list below), which already opens the `platform_credentials` domain over
# PostgreSQL and now registers the SAME service name (`credentials`): see
# packages/platform-domain/src/credentials.ts for the seam it implements, the
# official behaviours it reproduces, and where the model key actually lives
# (`llm-deepseek-api-key` resolves `DEEPSEEK_API_KEY` through `ctx.credentials`,
# and the Models page writes it through `dsh-api-settings-controller`).
#
# Exactly one provider may register a service name, so this disable is
# load-bearing, not cosmetic: leaving the official row enabled fails the
# composition loudly (two providers) instead of silently splitting the store
# between a file and the database.
#
# What is deliberately NOT moved: 0.2 has no settings-PROVIDER seam at all.
# `ctx.settings` is `SettingsForms`, the live-composition editor that persists
# through `ctx.configEditor` into the profile patch document the Loader reads
# from disk at boot; the old `settings.yaml` is a legacy file it imports once.
# A durable replacement would have to reimplement that writer AND materialize
# the document before the Loader reads it, which is not a supported seam. The
# credential half is, and that is the half the operator was re-entering.
- id: credentials
  disabled: true
# NEW IN 0.2, and disabled on purpose: this row records each top-level turn's
# changed files by reading workspace BYTES with host `node:fs`
# (`dsh-workspace-changes/lib/types/capture.js` opens the absolute host path;
# `lib/index.js` resolves it from `realpath(cwd)`). There is no `ctx.fs` seam
# in it, so there is no way to route those reads into the workspace pod where
# the bytes actually live: on this control plane the path is the empty
# /workspaces/<id> anchor (readOnlyRootFilesystem, nothing durable under
# DSH_HOME), so it would record nothing and could read a stale host copy.
# Disabled until upstream gives it a `ctx.fs` seam. The visible cost is the
# changed-files card under a closing assistant message (its producer is gone),
# not a broken profile.
- id: workspace-changes
  disabled: true
# Disabled as the direct consequence of the row above: the official
# `ui-deliverables` host half injects `workspaceChanges` (its full inject list
# is systemPrompt, connection, sessionQuery, sessionController, workspaceFiles,
# fs, sandboxPolicy, workspaceChanges), so with its only data source gone the
# row can never activate and every boot reports it as a pending entry.
#
# Cost of the disable, read off 0.2.0-rc.2's `dsh-client-ui-deliverables`: the
# `ui:deliverable-file-references` system-prompt section disappears, and so
# does the authenticated "native open" RPC for presented files
# (`registerPresentOpen` reads `ctx.workspaceChanges.summary/diff`). The
# `present` TOOL is NOT lost — it is `@deepseek-ai/dsh-tool-present`, which
# injects only tools/fs/sessionProjections — and the changed-files/diff card
# was already dead with `workspace-changes` (see above).
#
# Both rows come back together once upstream routes those byte reads through
# `ctx.fs`; at that point this disable and the one above are deleted.
- id: ui-deliverables
  disabled: true
# The web app announces this process's launch-token URL on stdout
# (`dsh web: http://…/?token=<launchToken>`) and tries to hand the URL to a
# desktop browser. In a container that means (a) a process-wide authentication
# secret lands in the pod logs and (b) every boot logs a failed browser launch.
# Neither is wanted here: the oauth2-proxy sidecar is the deployment's entry
# point, and for a browser that reaches this process the identity-bridge row
# below performs the launch-token handoff itself (302 -> 303) without printing
# anything.
#
# A patch replaces the targeted row's WHOLE `config`, so a restatement must
# carry every key the official row owns or the missing ones silently vanish.
# Verified against 0.2.0-rc.2's `--dump-default-config`: the official
# `web-runtime` row is exactly {openBrowser, printUrl, surfaceContext,
# trustedHosts}, and the four keys below are that set — complete for the
# version pinned here. 0.2.1-alpha.1 adds a fifth key, `publicUrl` (the
# advertised application URL, loopback when unset); if this tree ever moves to
# that line, this row MUST restate `publicUrl: !!js ctx.webStartup.publicUrl`
# or the advertised URL silently falls back to loopback.
- id: web-runtime
  name: '@deepseek-ai/dsh-web-app'
  inject:
    - webStartup
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: true
    trustedHosts: !!js ctx.webStartup.trustedHosts
# The official ui-workspace row is ENABLED (default) again: it owns the sidebar
# workspace/session list, the conversation hero and the `sidebar.workspaces`
# contract. The platform no longer keeps a patched copy of that browser, so
# there is no second registrant of the `workspace` locale namespace and nothing
# to collide with. @visecy/dsh-workspace-k8s only ADDS a status panel on the
# official slots (main keyed panel + sidebar.panellist entry); see
# packages/workspace-k8s/src/client.
# Row inventory notes (carried from the 0.1.5 upgrade, re-checked against
# 0.2.0-rc.2 where stated):
#  - `file-upload` (host `fileUploads` + client `fileUpload`), `resources` and
#    `workspace-files` are LOAD-BEARING for the 0.1.5 launcher: its
#    dsh-api-session-controller requires the `fileUploads` inject, so disabling
#    `file-upload` leaves `session-controller` pending and fails the activation
#    assertion. All three rows still exist in 0.2.0-rc.2 and none is disabled
#    here; whether the inject dependency is still literal in 0.2 was NOT
#    re-verified, so do not add a disable for them without re-checking.
#  - `open-in-app` / `ui-open-in-app` are safe to disable in a remote
#    deployment (nothing injects their service); they are left enabled here so
#    the official produced-file affordances keep working through
#    subprocess-k8s. (`ui-sidebar-browser` is the row 0.2 disables by itself
#    outside the desktop profile.)
#  - `tool-str-replace-editor` has not existed since 0.1.5 and is still absent
#    from 0.2.0-rc.2's base profile.
# DSH 0.1.2+ (unchanged in 0.2.0-rc.2): dsh-client-connection runs one uniform
# Host/Origin fence over every /api request / RPC channel / WebSocket upgrade,
# gated on its official `trustedHosts` config. The CLI already forwards
# --trusted-host values into this row via ctx.webRuntime; restate the row so
# deployments can also list public authorities through DSH_TRUSTED_HOSTS
# (comma-separated, BARE host[:port] authorities only — assertTrustedAuthority
# rejects schemes, paths and whitespace at plugin load). The built-in
# browser-session cookie layer is NOT bypassed: identity-bridge satisfies it
# through the official `authenticatedUrl()` -> `authorizeIndex()` exchange, so
# no compiled-artifact patch and no webserver fork is involved.
- id: connection
  name: '@deepseek-ai/dsh-client-connection'
  inject:
    - webRuntime
  config:
    trustedHosts: !!js >-
      [...(process.env.DSH_TRUSTED_HOSTS ?? '').split(',').map(entry => entry.trim()).filter(Boolean),
      ...ctx.webRuntime.trustedHosts]
- insert:
    # FIRST platform row on purpose: rows mount in list order, so every row
    # mounted after this one has its warn/error output reach the pod log.
    # Cordis's own exporter only ring-buffers in memory (nothing reads that
    # buffer) and dsh-app-boot's keeps warn/error for its StartupError path, so
    # before this row the composition had NO logger sink at all — a platform
    # failure was invisible, and a "fix" that silently did nothing looked
    # exactly like one that worked.
    #
    # `level` is the LEAST severe type written (error is always written);
    # `warn` keeps a normal boot quiet while surfacing every warn/error, which
    # is how every platform plugin reports failures. DSH_LOG_LEVEL overrides it
    # per deployment; an unknown value falls back to `warn` instead of failing
    # the row (a boot-time config error here would be invisible).
    - id: logging-stdout
      name: '@visecy/dsh-logging-stdout'
      config:
        level: !!js >-
          (['error','warn','info','debug'].includes(process.env.DSH_LOG_LEVEL)
          ? process.env.DSH_LOG_LEVEL
          : 'warn')
    # identity-bridge owns the exact `/` route (official token handoff via
    # authenticatedUrl/authorizeIndex), publishes __DSH_TRANSPORT__ so a remote
    # browser behaves as a host, and provides ctx.dshAuth over the oauth2-proxy
    # headers. The sidecar is the only thing that may reach this process, so
    # those headers are trusted evidence. Do NOT add a host here: the deploy
    # chart passes the loopback bind to `dsh web`.
    - id: identity-bridge
      name: '@visecy/dsh-identity-bridge'
      config:
        publicOrigin: !!js process.env.DSH_PUBLIC_ORIGIN
    - id: workspace-runtime
      name: '@visecy/dsh-workspace-k8s'
      config:
        namespace: !!js process.env.WS_NAMESPACE
        image: !!js process.env.WS_IMAGE ?? 'ghcr.io/visecy/dsh-platform/dsh-sandbox-daemon:v0.1.19'
        daemonPort: 4390
        idleTimeoutMs: !!js Number(process.env.WS_IDLE_TIMEOUT_MS ?? (5 * 60 * 1000))
        graceMs: !!js Number(process.env.WS_GRACE_MS ?? (3 * 60 * 60 * 1000))
        reconcileIntervalMs: !!js Number(process.env.WS_RECONCILE_INTERVAL_MS ?? 60000)
        storageClassName: !!js process.env.WS_STORAGE_CLASS ?? 'local-path'
        storageSize: '2Gi'
        metricIntervalMs: !!js Number(process.env.WS_METRIC_INTERVAL_MS ?? 15000)
        resources:
          cpu: !!js process.env.WS_CPU_LIMIT ?? '2'
          memory: !!js process.env.WS_MEM_LIMIT ?? '2Gi'
    - id: storage-db
      name: '@visecy/dsh-storage-db'
      config:
        type: postgres
        connectionString: !!js process.env.DSH_PG_CONNECTION_STRING
    - id: platform-domain
      name: '@visecy/dsh-platform-domain'
      config:
        backend: postgres
    - id: fs-k8s
      name: '@visecy/dsh-fs-k8s'
      config:
        daemonEndpoint: !!js (process.env.WS_DAEMON_ENDPOINT ?? 'http://127.0.0.1:4390')
        hostRoot: '/workspaces'
        podRoot: '/workspaces'
    - id: subprocess-k8s
      name: '@visecy/dsh-subprocess-k8s'
      config:
        daemonEndpoint: !!js (process.env.WS_DAEMON_ENDPOINT ?? 'http://127.0.0.1:4390')
        podRoot: '/workspaces'
    - id: session-persistence-rdb
      name: '@visecy/dsh-session-persistence-rdb'
      config:
        type: postgres
        connectionString: !!js process.env.DSH_PG_CONNECTION_STRING
    - id: bash-local
      name: '@deepseek-ai/dsh-bash-local'
      config:
        cwd: '/workspaces'
    - id: workspace-picker
      name: '@visecy/dsh-workspace-picker'
      config:
        namespace: !!js process.env.WS_NAMESPACE
        daemonPort: 4390
        hostRoot: '/workspaces'
    # the disabled auto picker used to mount the browse UI surface via
    # ctx.loader.create; with our workspace-picker providing the capability,
    # mount the browse surface explicitly so the in-app workspace directory
    # browser renders again.
    - id: ui-directory-picker-browse
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
# The official `@deepseek-ai/dsh-workspace` persists its whole registry through
# `ctx.storageDomain` — workspace records INCLUDING each record's `sessionIds`,
# which is the only place the session<->workspace association exists. That
# service is the official `dsh-storage-domain` row, whose base config is
# `backend: json` rooted at `dshHomePath('storages')`: an emptyDir here, so the
# registry is wiped on every pod replacement and the sidebar drops every
# session to "Ungrouped".
#
# Restate the row with the backend `storage-db` already registers and provides
# (`type: postgres` — see storage-db/src/index.ts) so the official facility
# reaches Postgres. This MUST be a TOP-LEVEL row, not an `insert:` entry: the
# base profile already owns `storage-domain`, and inserting the same id makes
# the loader carry two rows for it (see the f830ddf/e06e809 history). A
# top-level row patches the base row in place and keeps its `name`.
#
# ORDERING CONSTRAINT: this row must ship together with the startup reconcile
# and the session rebind in packages/workspace-k8s. If the first boot on the DB
# backend still lacks the /workspaces/<id> anchors, the registry writes an empty
# association set to Postgres and `initialized: true` makes it permanent.
- id: storage-domain
  config:
    backend: postgres
