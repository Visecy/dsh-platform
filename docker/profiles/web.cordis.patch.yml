- id: webserver
  disabled: true
- id: subprocess
  disabled: true
- id: bash-sandbox
  disabled: true
- id: permission
  disabled: true
- id: session-persistence-jsonl
  disabled: true
- id: fs-sandbox
  disabled: true
- id: directory-picker
  disabled: true
# The web app announces this process's launch-token URL on stdout
# (`dsh web: http://…/?token=<launchToken>`) and tries to hand the URL to a
# desktop browser. In a container that means (a) a process-wide authentication
# secret lands in the pod logs and (b) every boot logs a failed browser launch.
# Neither is wanted here: the OIDC gate is the entry point, and any in-process
# consumer that really needs the tokenized URL can call
# `ctx.connection.authenticatedUrl(origin)` directly.
- id: web-runtime
  name: '@deepseek-ai/dsh-web-app'
  inject:
    - webStartup
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: true
    trustedHosts: !!js ctx.webStartup.trustedHosts
# the official ui-workspace row is disabled: its sidebar/hero surfaces are
# owned by the vendored WorkspaceBrowser in @visecy/dsh-workspace-k8s
# (status patches), and both registering the same locale namespace crashes
# the official apply.
- id: ui-workspace
  disabled: true
# DSH 0.1.5 row inventory notes (dsh-web-app):
#  - `file-upload` (host `fileUploads` + client `fileUpload`), `resources` and
#    `workspace-files` are LOAD-BEARING: 0.1.5's dsh-api-session-controller
#    requires the `fileUploads` inject, so disabling `file-upload` leaves
#    `session-controller` pending and fails the launcher activation assertion.
#    Do not add disables for them.
#  - `open-in-app` / `ui-open-in-app` are safe to disable in a remote
#    deployment (nothing injects their service); they are left enabled here so
#    the official produced-file affordances keep working through
#    subprocess-k8s.
#  - `tool-str-replace-editor` no longer exists in 0.1.5's base profile.
# DSH 0.1.2+ (unchanged in 0.1.5): dsh-client-connection runs one uniform
# Host/Origin fence over every /api request / RPC channel / WebSocket upgrade,
# gated on its official `trustedHosts` config. The CLI already forwards
# --trusted-host values into this row via ctx.webRuntime; restate the row so
# deployments can also list public authorities through DSH_TRUSTED_HOSTS
# (comma-separated, BARE host[:port] authorities only — assertTrustedAuthority
# rejects schemes, paths and whitespace at plugin load). The built-in
# browser-session cookie layer is bypassed by scripts/patch-dsh.mjs — the OIDC
# gate is the deployment's session layer.
- id: connection
  name: '@deepseek-ai/dsh-client-connection'
  inject:
    - webRuntime
  config:
    trustedHosts: !!js >-
      [...(process.env.DSH_TRUSTED_HOSTS ?? '').split(',').map(entry => entry.trim()).filter(Boolean),
      ...ctx.webRuntime.trustedHosts]
- insert:
    - id: webserver-gated
      name: '@visecy/dsh-web-auth'
      inject: [webStartup]
      config:
        host: '0.0.0.0'
        port: !!js ctx.webStartup.port ?? 3080
    - id: dsh-auth-oidc
      name: '@visecy/dsh-auth-oidc'
      config:
        oidc:
          issuer: !!js process.env.OIDC_ISSUER
          clientId: !!js process.env.OIDC_CLIENT_ID
          clientSecret: !!js process.env.OIDC_CLIENT_SECRET
          redirectUri: !!js process.env.OIDC_REDIRECT_URI
          scopes: [openid, profile, email, groups]
        sessionSecret: !!js process.env.SESSION_SECRET
        adminGroups: !!js (process.env.ADMIN_GROUPS ?? 'dsh-admins').split(',')
    - id: workspace-runtime
      name: '@visecy/dsh-workspace-k8s'
      config:
        namespace: !!js process.env.WS_NAMESPACE
        image: !!js process.env.WS_IMAGE ?? 'ghcr.io/visecy/dsh-platform/dsh-sandbox-daemon:v0.1.19'
        daemonPort: 4390
        idleTimeoutMs: !!js Number(process.env.WS_IDLE_TIMEOUT_MS ?? (5 * 60 * 1000))
        graceMs: !!js Number(process.env.WS_GRACE_MS ?? (3 * 60 * 60 * 1000))
        reconcileIntervalMs: !!js Number(process.env.WS_RECONCILE_INTERVAL_MS ?? 60000)
        storageClassName: !!js process.env.WS_STORAGE_CLASS ?? 'local-path'
        storageSize: '2Gi'
        metricIntervalMs: !!js Number(process.env.WS_METRIC_INTERVAL_MS ?? 15000)
        resources:
          cpu: !!js process.env.WS_CPU_LIMIT ?? '2'
          memory: !!js process.env.WS_MEM_LIMIT ?? '2Gi'
    - id: storage-db
      name: '@visecy/dsh-storage-db'
      config:
        type: postgres
        connectionString: !!js process.env.DSH_PG_CONNECTION_STRING
    - id: platform-domain
      name: '@visecy/dsh-platform-domain'
      config:
        backend: postgres
    - id: fs-k8s
      name: '@visecy/dsh-fs-k8s'
      config:
        daemonEndpoint: !!js (process.env.WS_DAEMON_ENDPOINT ?? 'http://127.0.0.1:4390')
        hostRoot: '/workspaces'
        podRoot: '/workspaces'
    - id: subprocess-k8s
      name: '@visecy/dsh-subprocess-k8s'
      config:
        daemonEndpoint: !!js (process.env.WS_DAEMON_ENDPOINT ?? 'http://127.0.0.1:4390')
        podRoot: '/workspaces'
    - id: session-persistence-rdb
      name: '@visecy/dsh-session-persistence-rdb'
      config:
        type: postgres
        connectionString: !!js process.env.DSH_PG_CONNECTION_STRING
    - id: bash-local
      name: '@deepseek-ai/dsh-bash-local'
      config:
        cwd: '/workspaces'
    - id: workspace-picker
      name: '@visecy/dsh-workspace-picker'
      config:
        namespace: !!js process.env.WS_NAMESPACE
        daemonPort: 4390
        hostRoot: '/workspaces'
    # the disabled auto picker used to mount the browse UI surface via
    # ctx.loader.create; with our workspace-picker providing the capability,
    # mount the browse surface explicitly so the in-app workspace directory
    # browser renders again.
    - id: ui-directory-picker-browse
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
