name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/visecy/dsh-web-platform

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # npm Trusted Publisher (OIDC) — no long-lived token
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          node scripts/build-pkg.mjs auth-oidc src/plugin.ts
          node scripts/build-pkg.mjs fs-k8s src/index.ts
          node scripts/build-pkg.mjs subprocess-k8s src/index.ts
          node scripts/build-pkg.mjs workspace-k8s src/index.ts

      - name: Test published packages
        run: |
          cd packages/auth-oidc && pnpm test && cd ../..
          cd packages/fs-k8s && pnpm test && cd ../..
          cd packages/subprocess-k8s && pnpm test && cd ../..
          cd packages/workspace-k8s && pnpm test && cd ../..

      # npm Trusted Publisher: no NPM_TOKEN. The registry verifies our GitHub
      # Actions OIDC token against the publisher configured on npmjs.com.
      # --registry pins the official registry (repo .npmrc points at a mirror).
      - name: Publish to npm (@visecy)
        run: |
          for p in auth-oidc fs-k8s subprocess-k8s workspace-k8s; do
            cd packages/$p
            npm publish --access public --provenance --registry=https://registry.npmjs.org
            cd ../..
          done

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dsh-web-platform.Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }},${{ env.IMAGE }}:latest
