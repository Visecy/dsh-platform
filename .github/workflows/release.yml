name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/visecy/dsh-web-platform
  DAEMON_IMAGE: ghcr.io/visecy/dsh-platform/dsh-sandbox-daemon

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # npm Trusted Publisher (OIDC) — no long-lived token
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The tag is the single source of truth: packages are versioned to the
      # tag before publishing, and the image installs that exact version.
      - name: Sync versions to tag
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "PLUGIN_VERSION=$VER" >> $GITHUB_ENV
          for p in auth-oidc fs-k8s subprocess-k8s workspace-k8s workspace-picker workspace-ui; do
            (cd packages/$p && npm version $VER --no-git-tag-version --allow-same-version)
          done

      - name: Build packages
        run: |
          node scripts/build-pkg.mjs auth-oidc src/plugin.ts
          node scripts/build-pkg.mjs fs-k8s src/index.ts
          node scripts/build-pkg.mjs subprocess-k8s src/index.ts
          node scripts/build-pkg.mjs workspace-k8s src/index.ts
          node scripts/build-pkg.mjs workspace-picker src/index.ts
          node scripts/build-workspace-ui.mjs

      - name: Test published packages
        run: |
          cd packages/auth-oidc && pnpm test && cd ../..
          cd packages/fs-k8s && pnpm test && cd ../..
          cd packages/subprocess-k8s && pnpm test && cd ../..
          cd packages/workspace-k8s && pnpm test && cd ../..
          cd packages/workspace-picker && pnpm test && cd ../..
          cd packages/workspace-ui && pnpm --silent test 2>/dev/null || true

      # npm Trusted Publisher: no NPM_TOKEN. The registry verifies our GitHub
      # Actions OIDC token against the publisher configured on npmjs.com.
      - name: Publish to npm (@visecy)
        run: |
          for p in auth-oidc fs-k8s subprocess-k8s workspace-k8s workspace-picker workspace-ui; do
            cd packages/$p
            npm publish --access public --provenance --registry=https://registry.npmjs.org
            cd ../..
          done

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dsh-web-platform.Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }},${{ env.IMAGE }}:latest
          build-args: |
            PLUGIN_VERSION=${{ env.PLUGIN_VERSION }}
            DSH_VERSION=0.1.1-rc.2

      - name: Build sandbox daemon image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dsh-sandbox-daemon.Dockerfile
          push: true
          tags: ${{ env.DAEMON_IMAGE }}:${{ github.ref_name }},${{ env.DAEMON_IMAGE }}:latest
